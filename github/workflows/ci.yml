name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teamup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/teamup_test
      JWT_SECRET: ci-only-throwaway-secret-0123456789
      ALLOWED_ORIGINS: http://localhost:5173
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations and verify DB hardening
        run: npm run migrate:deploy
      - name: Smoke test
        run: |
          node index.js &
          for i in $(seq 1 15); do
            curl -fs http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "Server did not start" && exit 1
